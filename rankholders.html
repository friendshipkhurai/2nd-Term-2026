<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank Holders - Friendship Educational Academy</title>
    <style>

        *{margin:0;padding:0;box-sizing:border-box}
        @page{size:A4 landscape;margin:0}
        html,body{width:100%;min-height:100%}
        body{
            font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;
            background:#dff6ff;
            padding:0;
            color:#183153;
        }

        .print-btn-container{
            position:fixed;bottom:18px;right:18px;z-index:1000;
            display:flex;gap:10px
        }
        .print-btn{
            background:#1464d2;color:#fff;border:0;padding:11px 22px;
            border-radius:24px;font-size:13px;font-weight:700;cursor:pointer;
            box-shadow:0 4px 12px rgba(20,70,130,.25)
        }
        .print-btn.secondary{background:#64748b}

        .toppers-page{
            position:relative;overflow:hidden;
            page-break-after:always;page-break-inside:avoid;
            width:100%;min-height:21cm;
            padding:8px 12px 10px;
            margin:0;
            background:
                radial-gradient(circle at 3% 12%,rgba(255,255,255,.9) 0 22px,transparent 23px),
                radial-gradient(circle at 97% 20%,rgba(255,255,255,.75) 0 28px,transparent 29px),
                linear-gradient(180deg,#f5fdff 0%,#ffffff 62%,#effff1 100%);
            border:5px solid #2a9df4;
            border-radius:24px;
            box-shadow:inset 0 0 0 2px #d6f1ff;
            display:flex;flex-direction:column;
        }
        .toppers-page:before,.toppers-page:after{
            position:absolute;z-index:0;pointer-events:none;
            font-size:38px;opacity:.9
        }
        .toppers-page:before{content:"⭐ ☁️ 🌸";left:10px;top:72px}
        .toppers-page:after{content:"🌸 ☁️ ⭐";right:10px;bottom:62px}

        .rank-banner{
            position:relative;z-index:2;width:100%;
            background:linear-gradient(180deg,#0759c9 0%,#0d75d9 58%,#064aa8 100%);
            color:#fff;padding:7px 20px 12px;
            border-radius:18px 18px 32px 32px;
            margin-bottom:4px;display:flex;align-items:center;
            justify-content:center;flex-shrink:0;
            box-shadow:0 5px 0 #063c91,0 8px 16px rgba(0,72,150,.2);
            border:3px solid #fff;
            min-height:52px;
        }
        .rank-banner:after{
            content:"";position:absolute;left:8%;right:8%;bottom:-7px;height:14px;
            background:#ffd62e;border-radius:50%;z-index:-1
        }
        .banner-left{display:flex;align-items:center;justify-content:center;gap:10px}
        .banner-icon{
            font-size:22px;background:#fff2a8;width:34px;height:34px;
            border-radius:50%;display:flex;align-items:center;justify-content:center;
            border:3px solid #ffbd00
        }
        .banner-title{
            font-size:24px;font-weight:900;letter-spacing:1px;
            color:#fff;text-shadow:2px 2px 0 #06459c;
        }
        .banner-subtitle{font-size:9px;text-align:center;opacity:.95;margin-top:1px}
        .banner-right{position:absolute;right:18px;text-align:right;border-left:2px solid rgba(255,255,255,.45);padding-left:10px}
        .banner-exam{font-size:8px;font-weight:700}

        .class-header{position:relative;z-index:2;text-align:center;padding:1px 0 4px;flex-shrink:0}
        .class-name-large{
            display:inline-block;font-size:27px;font-weight:900;letter-spacing:2px;
            color:#173e8f;text-transform:uppercase;
            background:#fff;border:4px solid #18a5ff;border-radius:999px;
            padding:1px 32px;box-shadow:0 3px 0 #0873c8
        }
        .class-name-large span{
            background:linear-gradient(90deg,#ef2d74,#ff7a00,#08a55c,#1267d5);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
        }
        .class-name-large .divider{color:#ffbf00;-webkit-text-fill-color:#ffbf00;margin:0 8px}

        .toppers-grid{
            position:relative;z-index:2;display:grid;gap:14px;flex:1;
            align-items:stretch;padding:10px 52px 4px
        }
        .toppers-grid.count-3{grid-template-columns:repeat(3,1fr)}
        .toppers-grid.count-4{grid-template-columns:repeat(4,1fr)}
        .toppers-grid.count-1,.toppers-grid.count-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

        .topper-card{
            background:rgba(255,255,255,.96);border-radius:25px;
            border:4px solid #22a6f2;padding:22px 9px 8px;
            text-align:center;display:flex;flex-direction:column;align-items:center;
            position:relative;box-shadow:0 5px 0 rgba(14,105,190,.18),0 7px 18px rgba(60,120,170,.13);
            overflow:visible
        }
        .topper-card:nth-child(3n+1){border-color:#ffc928;background:linear-gradient(180deg,#fffdf0,#fff)}
        .topper-card:nth-child(3n+2){border-color:#2b9ef4;background:linear-gradient(180deg,#f1fbff,#fff)}
        .topper-card:nth-child(3n){border-color:#f54291;background:linear-gradient(180deg,#fff4f9,#fff)}

        .rank-badge{
            position:absolute;top:-21px;left:50%;transform:translateX(-50%);
            width:65px;height:65px;border-radius:50%;display:flex;align-items:center;
            justify-content:center;font-size:31px;font-weight:900;color:#fff;
            box-shadow:0 4px 0 rgba(0,0,0,.18),0 5px 13px rgba(0,0,0,.2);
            z-index:5;border:4px solid #fff
        }
        .rank-1{background:linear-gradient(145deg,#ffe45a,#ffad00)}
        .rank-2{background:linear-gradient(145deg,#e9edf3,#9da7b4);color:#12377d}
        .rank-3{background:linear-gradient(145deg,#ffbd75,#b96525)}
        .rank-4{background:linear-gradient(145deg,#67d878,#229446)}
        .rank-5{background:linear-gradient(145deg,#55b5ff,#1764c7)}
        .rank-badge-text{font-size:29px}

        .count-3 .topper-photo{
            width:calc(100% - 34px);height:365px;max-width:340px;
            border-radius:19px;overflow:hidden;border:5px solid #1968c9;
            background:#eaf5ff;margin-top:18px;flex-shrink:0;
            box-shadow:0 6px 16px rgba(0,70,150,.18)
        }
        .count-4 .topper-photo{
            width:calc(100% - 18px);height:300px;max-width:255px;
            border-radius:18px;overflow:hidden;border:5px solid #1968c9;
            background:#eaf5ff;margin-top:18px;flex-shrink:0;
            box-shadow:0 5px 14px rgba(0,70,150,.16)
        }
        .count-1 .topper-photo,.count-2 .topper-photo{
            width:340px;height:300px;border-radius:19px;overflow:hidden;
            border:5px solid #1968c9;background:#eaf5ff;margin-top:18px;flex-shrink:0
        }
        .topper-photo img{width:100%;height:100%;object-fit:cover;display:block}
        .topper-photo .no-photo{
            width:100%;height:100%;display:flex;align-items:center;justify-content:center;
            background:linear-gradient(135deg,#8ed9ff,#e8f8ff);color:#fff;font-size:70px
        }
        .count-4 .topper-photo .no-photo{font-size:55px}
        .count-1 .topper-photo .no-photo,.count-2 .topper-photo .no-photo{font-size:80px}

        .topper-name{
            font-weight:900;color:#123b8d;margin-top:9px;line-height:1.05;
            display:flex;align-items:center;justify-content:center;word-break:break-word;
            text-transform:uppercase;text-shadow:0 1px 0 #fff
        }
        .count-3 .topper-name{font-size:26px;min-height:48px}
        .count-4 .topper-name{font-size:21px;min-height:44px}
        .count-1 .topper-name,.count-2 .topper-name{font-size:29px;min-height:52px}
        .topper-roll{color:#111;margin-top:2px;font-weight:800}
        .count-3 .topper-roll{font-size:15px}
        .count-4 .topper-roll{font-size:14px}
        .count-1 .topper-roll,.count-2 .topper-roll{font-size:16px}

        .topper-stats{
            display:flex;justify-content:center;gap:20px;margin-top:6px;
            padding:6px 14px;background:#fff;border-radius:12px;
            border:2px solid #ffc45c;width:100%;max-width:280px
        }
        .count-4 .topper-stats{max-width:220px}
        .count-1 .topper-stats,.count-2 .topper-stats{max-width:320px}
        .stat-item{text-align:center}
        .stat-label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.4px;font-weight:800}
        .stat-value{font-size:27px;font-weight:900;color:#ef1717;line-height:1.05}

        .subject-grades{
            margin-top:6px;padding-top:6px;border-top:2px dashed #cfe1ef;
            width:100%;display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;min-height:34px
        }
        .grade-letter{font-weight:900;padding:3px 11px;border-radius:8px;min-width:32px;text-align:center;background:#e8eef5;color:#17417e}
        .count-3 .grade-letter{font-size:20px}
        .count-4 .grade-letter{font-size:15px;padding:3px 9px}
        .count-1 .grade-letter,.count-2 .grade-letter{font-size:20px}
        .grade-letter.A{color:#07985c;background:#d8f7e7}
        .grade-letter.B{color:#2169d2;background:#dceaff}
        .grade-letter.C{color:#d78a00;background:#fff2c9}
        .grade-letter.D{color:#e66a00;background:#ffe5cd}
        .grade-letter.E,.grade-letter.F{color:#dc2626;background:#ffdede}

        .topper-footer{
            margin-top:auto;padding:7px 4px 0;width:100%;display:flex;
            justify-content:space-around;border-top:2px solid #d8e6f0;color:#222;font-weight:800
        }
        .count-3 .topper-footer{font-size:13px}
        .count-4 .topper-footer{font-size:12px}
        .count-1 .topper-footer,.count-2 .topper-footer{font-size:14px}
        .topper-footer span{font-weight:900;color:#173b8f}

        .loading{text-align:center;padding:50px;font-size:18px;color:#17417e}
        .loading .spinner{
            display:inline-block;width:42px;height:42px;border:5px solid #dcebf7;
            border-top:5px solid #1267d5;border-right:5px solid #ffbf00;
            border-radius:50%;animation:spin 1s linear infinite;margin-bottom:10px
        }
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

        .error-msg{text-align:center;padding:30px;color:#c62828;background:#fff0f0;border-radius:15px;font-size:16px}
        .no-data{text-align:center;padding:30px;color:#64748b;font-size:16px}
        .status-bar{
            position:fixed;top:0;left:0;right:0;background:#1267d5;color:#fff;
            padding:7px 15px;font-size:12px;z-index:999;text-align:center;display:none
        }
        .status-bar.show{display:block}

        @media print{
            body{background:#fff;padding:0}
            .print-btn-container,.status-bar{display:none!important}
            .toppers-page{box-shadow:none;border-radius:0;border-width:3px;padding:5px 8px 7px;min-height:21cm}
            .topper-card{box-shadow:none}
            .rank-badge,.grade-letter,.rank-banner,.banner-icon,.topper-photo img{
                -webkit-print-color-adjust:exact;print-color-adjust:exact
            }
            .count-3 .topper-photo{width:300px;height:340px}
            .count-3 .topper-name{font-size:24px;min-height:44px}
            .count-3 .stat-value{font-size:27px}
            .count-3 .grade-letter{font-size:19px}
            .count-3 .topper-footer{font-size:12px}
            .count-4 .topper-photo{
                width:225px;height:295px;max-width:225px;
                border-width:5px;border-radius:16px;margin-top:18px
            }
            .count-4 .topper-name{font-size:20px;min-height:40px}
            .count-4 .topper-roll{font-size:14px}
            .count-4 .stat-value{font-size:24px}
            .count-4 .grade-letter{font-size:16px;padding:3px 9px}
            .toppers-grid.count-4{
                grid-template-columns:repeat(4,1fr);
                gap:8px;
                padding:8px 20px 3px
            }
            .count-4 .topper-footer{font-size:12px}
            .count-4 .topper-footer span{font-size:13px}
            .class-header{padding:3px 0 7px}
            .class-name-large{
                font-size:34px;
                letter-spacing:3px;
                padding:3px 38px;
                border-width:4px;
                line-height:1.05;
                box-shadow:0 4px 0 #0873c8
            }
            .count-1 .topper-photo,.count-2 .topper-photo{width:300px;height:285px}
            /* ===== PRINT: CLEAR, BOLD, EASY-TO-READ TEXT ===== */
            .topper-card{
                color:#111 !important;
            }
            .topper-name{
                color:#102f73 !important;
                -webkit-text-fill-color:#102f73 !important;
                font-weight:900 !important;
                font-size:24px !important;
                line-height:1.08 !important;
                text-shadow:none !important;
            }
            .count-4 .topper-name{
                font-size:20px !important;
                font-weight:900 !important;
            }
            .topper-roll{
                color:#111 !important;
                font-weight:900 !important;
                font-size:15px !important;
            }
            .count-4 .topper-roll{
                font-size:14px !important;
                font-weight:900 !important;
            }
            .stat-label{
                color:#444 !important;
                font-weight:900 !important;
                font-size:12px !important;
            }
            .stat-value{
                color:#e01818 !important;
                font-weight:900 !important;
            }
            .count-3 .stat-value{font-size:29px !important}
            .count-4 .stat-value{font-size:24px !important}
            .grade-letter{
                font-weight:900 !important;
                border:1px solid rgba(0,0,0,.08) !important;
            }
            .count-3 .grade-letter{font-size:20px !important}
            .count-4 .grade-letter{font-size:16px !important}
            .topper-footer{
                color:#111 !important;
                font-weight:900 !important;
                font-size:13px !important;
            }
            .count-4 .topper-footer{
                font-size:12px !important;
            }
            .topper-footer span{
                color:#102f73 !important;
                font-weight:900 !important;
            }
            .count-4 .topper-footer span{
                font-size:13px !important;
            }
            .banner-title{
                font-weight:900 !important;
                font-size:25px !important;
            }
            .banner-subtitle,.banner-exam{
                font-weight:800 !important;
            }


            /* ===== PRINT: ALWAYS SHOW LARGE CLASS NAME ===== */
            .class-header{
                display:block !important;
                visibility:visible !important;
                position:relative;
                z-index:20;
                height:auto !important;
                min-height:48px;
                margin:0 0 5px !important;
                padding:3px 0 7px !important;
                text-align:center !important;
            }
            .class-name-large{
                display:inline-block !important;
                visibility:visible !important;
                position:relative;
                z-index:21;
                color:#123b8d !important;
                -webkit-text-fill-color:#123b8d !important;
                background:#fff !important;
                border:4px solid #18a5ff !important;
                border-radius:999px !important;
                padding:4px 42px !important;
                font-size:34px !important;
                line-height:1.05 !important;
                font-weight:900 !important;
                letter-spacing:3px !important;
                text-shadow:none !important;
                box-shadow:0 4px 0 #0873c8 !important;
            }
            .class-name-large span{
                color:#123b8d !important;
                -webkit-text-fill-color:#123b8d !important;
                background:none !important;
            }

            /* ===== PRINT: FOUR LARGE PHOTOS ===== */
            .toppers-grid.count-4{
                grid-template-columns:repeat(4,minmax(0,1fr)) !important;
                gap:7px !important;
                padding:8px 10px 3px !important;
            }
            .count-4 .topper-photo{
                width:100% !important;
                max-width:235px !important;
                height:300px !important;
                border:5px solid #1968c9 !important;
                border-radius:16px !important;
                margin-top:18px !important;
            }
            .count-4 .topper-name{
                font-size:19px !important;
                min-height:40px !important;
                line-height:1.05 !important;
            }
            .count-4 .topper-roll{font-size:13px !important}
            .count-4 .topper-stats{
                max-width:210px !important;
                padding:5px 8px !important;
            }
            .count-4 .stat-value{font-size:22px !important}
            .count-4 .grade-letter{
                font-size:15px !important;
                padding:2px 7px !important;
                min-width:28px !important;
            }
            .count-4 .topper-footer{
                font-size:11px !important;
                padding-top:5px !important;
            }
            .count-4 .topper-footer span{font-size:12px !important}

        }

/* ===== STUDENT INFORMATION: BELOW PERCENTAGE ===== */
        .topper-card{
            justify-content:flex-start !important;
        }
        .topper-name{order:2 !important;}
        .topper-roll{order:3 !important;}
        .topper-stats{order:4 !important;}
        .subject-grades{order:5 !important;}
        .topper-footer{
            order:6 !important;
            margin-top:7px !important;
            margin-bottom:0 !important;
            padding:6px 5px !important;
            width:100% !important;
            border-top:1px solid #d8e6f0 !important;
            border-bottom:1px solid #d8e6f0 !important;
            display:grid !important;
            grid-template-columns:1fr 1fr !important;
            gap:8px !important;
            align-items:start !important;
            text-align:center !important;
            color:#111 !important;
            font-weight:900 !important;
        }
        .topper-footer > div{line-height:1.15 !important;}
        .topper-footer > div + div{
            border-left:1px dashed #b9cfe1;
            padding-left:8px;
        }



        /* ===== STUDENT NAMES: BOLD TWO-LINE PRESENTATION ===== */
        .topper-name{
            width:100% !important;
            max-width:100% !important;
            min-height:52px !important;
            height:52px !important;
            display:-webkit-box !important;
            -webkit-box-orient:vertical !important;
            -webkit-line-clamp:2 !important;
            overflow:hidden !important;
            text-align:center !important;
            align-items:center !important;
            justify-content:center !important;
            font-weight:900 !important;
            color:#102f73 !important;
            -webkit-text-fill-color:#102f73 !important;
            line-height:1.05 !important;
        }
        .count-3 .topper-name{
            font-size:25px !important;
            min-height:54px !important;
            height:54px !important;
        }
        .count-4 .topper-name{
            font-size:19px !important;
            min-height:43px !important;
            height:43px !important;
        }
        .count-1 .topper-name,.count-2 .topper-name{
            font-size:29px !important;
            min-height:60px !important;
            height:60px !important;
        }

        @media print{
            .topper-name{
                display:-webkit-box !important;
                -webkit-box-orient:vertical !important;
                -webkit-line-clamp:2 !important;
                overflow:hidden !important;
                white-space:normal !important;
                font-weight:900 !important;
                color:#102f73 !important;
                -webkit-text-fill-color:#102f73 !important;
            }
            .count-3 .topper-name{
                font-size:24px !important;
                min-height:48px !important;
                height:48px !important;
            }
            .count-4 .topper-name{
                font-size:19px !important;
                min-height:40px !important;
                height:40px !important;
            }
            .count-1 .topper-name,.count-2 .topper-name{
                font-size:28px !important;
                min-height:56px !important;
                height:56px !important;
            }
        }


        /* ===== FINAL NAME STYLE: ARIAL BOLD ===== */
        .topper-name{
            font-family:Arial,Helvetica,sans-serif !important;
            font-weight:700 !important;
            color:#102f73 !important;
            -webkit-text-fill-color:#102f73 !important;
            text-shadow:none !important;
        }
        @media print{
            .topper-name{
                font-family:Arial,Helvetica,sans-serif !important;
                font-weight:700 !important;
                color:#102f73 !important;
                -webkit-text-fill-color:#102f73 !important;
                text-shadow:none !important;
            }
        }


/* FINAL NAME STYLE: ARIAL BLACK */

    font-family:"Arial Black",Arial,Helvetica,sans-serif !important;
    font-weight:900 !important;
    color:#102f73 !important;

    .topper-name{

        @media screen and (max-width:1200px){
            .toppers-grid{padding-left:30px;padding-right:30px}
            .count-3 .topper-photo{height:310px}
            .count-3 .topper-name{font-size:22px}
            .class-name-large{font-size:24px}
        }
        @media screen and (max-width:768px){
            .toppers-page{border-width:3px;border-radius:15px;padding:5px}
            .rank-banner{padding:6px 8px}
            .banner-title{font-size:18px}
            .banner-right{display:none}
            .class-name-large{font-size:19px;padding:1px 18px}
            .toppers-grid.count-3,.toppers-grid.count-4{grid-template-columns:repeat(2,1fr);padding:5px;gap:6px}
            .count-3 .topper-photo,.count-4 .topper-photo{width:calc(100% - 12px);height:190px}
            .count-3 .topper-name,.count-4 .topper-name{font-size:18px;min-height:36px}
            .count-3 .topper-roll,.count-4 .topper-roll{font-size:11px}
            .stat-value{font-size:21px}
            .grade-letter{font-size:14px!important;padding:2px 7px}
            .topper-footer{font-size:10px!important}
            .rank-badge{width:48px;height:48px;font-size:22px;top:-16px}
            .rank-badge-text{font-size:21px}
        }
        @media screen and (max-width:480px){
            .toppers-grid.count-3,.toppers-grid.count-4{grid-template-columns:1fr 1fr}
            .count-3 .topper-photo,.count-4 .topper-photo{height:145px}
            .count-3 .topper-name,.count-4 .topper-name{font-size:14px;min-height:30px}
            .topper-footer{flex-direction:column;gap:2px}
            .class-name-large{font-size:16px}
        }

    </style>

<style id="percentage-arial-black">
.percentage,
.percentage *,
.student-percentage,
.student-percentage *,
.percent,
.percent *,
[class*="percentage"],
[class*="percentage"] * {
    font-family: "Arial Black", Arial, Helvetica, sans-serif !important;
    font-weight: 900 !important;
}
</style>


<style id="light-background-override">
html, body {
    background: #f4f8fc !important;
}
body {
    background-image: none !important;
}
.toppers-page {
    background: #f8fbff !important;
}
</style>

</head>
<body>

    <div id="statusBar" class="status-bar">Loading rank holders data...</div>

    <div class="print-btn-container">
        <button class="print-btn" onclick="window.print();">🖨️ Print All</button>
        <button class="print-btn secondary" onclick="location.reload();">🔄 Refresh</button>
    </div>

    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <div>Loading rank holders data...</div>
        </div>
    </div>

    <script src="js/bridge.js"></script>
<script>
        const CONFIG = {
            appName: "Friendship Educational Academy",
            sheetId: "1SNquwc1yWQYYGF23YGWUGkzJVGlWyHjtGogaXceB3zM",
            maxMarks: 80
        };

        const GRADE_SUBJECTS_MAP = {
            'Pre-Nursery': ['MANIPURI(GRADE)', 'G.K/CONVERSATION(GRADE)', 'SCIENCE(GRADE)', 'DRAWING(GRADE)',
                'HANDWRITING(GRADE)', 'IDENTIFICATION(GRADE)', 'RHYMES(GRADE)'
            ],
            'Nursery': ['HINDI(GRADE)', 'DRAWING(GRADE)', 'RHYMES(GRADE)', 'HANDWRITING(GRADE)'],
            'KG': ['HANDWRITING(GRADE)', 'DRAWING(GRADE)', 'RHYMES(GRADE)'],
            'I(One)': ['HANDWRITING', 'DRAWING'],
            'II(Two)': ['HANDWRITING', 'DRAWING']
        };

        const GRADE_CLASSES = ['Pre-Nursery', 'Nursery', 'KG', 'I(One)', 'II(Two)'];

        async function loadToppers() {
            const app = document.getElementById('app');
            const statusBar = document.getElementById('statusBar');

            try {
                statusBar.textContent = '📊 Fetching rank holders data...';
                statusBar.classList.add('show');

                const result = await google.script.run
                    .withSuccessHandler(function(data) {
                        statusBar.textContent = '✅ Data loaded successfully!';
                        setTimeout(() => statusBar.classList.remove('show'), 2000);
                        renderToppers(data);
                    })
                    .withFailureHandler(function(error) {
                        statusBar.textContent = '❌ Error: ' + error;
                        statusBar.style.background = '#dc2626';
                        app.innerHTML = '<div class="error-msg">❌ Failed to load data: ' + error +
                            '<br><br><button onclick="location.reload()" style="padding:10px 20px;background:#1e3c72;color:white;border:none;border-radius:5px;cursor:pointer;">Retry</button></div>';
                    })
                    .getClasswiseToppers();

            } catch (error) {
                statusBar.textContent = '❌ Error: ' + error.message;
                statusBar.style.background = '#dc2626';
                app.innerHTML = '<div class="error-msg">❌ Failed to load data. Please check your connection and try again.</div>';
                console.error('Error:', error);
            }
        }

        function renderToppers(data) {
            const app = document.getElementById('app');

            if (!data || !data.data || Object.keys(data.data).length === 0) {
                app.innerHTML = '<div class="no-data">📋 No rank holders data available. Please ensure results are published.</div>';
                return;
            }

            let html = '';
            const classes = Object.keys(data.data).sort();

            for (const className of classes) {
                const toppers = data.data[className];
                if (!toppers || toppers.length === 0) continue;

                const gradeSubjects = GRADE_SUBJECTS_MAP[className] || [];
                const isGradeClass = GRADE_CLASSES.includes(className);

                let countClass = 'count-1';
                if (toppers.length === 2) countClass = 'count-2';
                else if (toppers.length === 3) countClass = 'count-3';
                else if (toppers.length >= 4) countClass = 'count-4';

                html += `
                    <div class="toppers-page">
                        <div class="rank-banner">
                            <div class="banner-left">
                                <div class="banner-icon">🏆</div>
                                <div>
                                    <div class="banner-title">⭐ RANK HOLDERS ⭐</div>
                                    <div class="banner-subtitle">${CONFIG.appName}</div>
                                </div>
                            </div>
                            <div class="banner-right">
                                <div class="banner-exam">${toppers[0]['Name of Examination'] || 'Annual Examination'}</div>
                            </div>
                        </div>
                        
                        <!-- CLASS NAME - CENTER TOP -->
                        <div class="class-header">
                            <div class="class-name-large">
                                <span>${className}</span>
                            </div>
                        </div>
                        
                        <div class="toppers-grid ${countClass}">
                `;

                for (const topper of toppers) {
                    const rank = topper.Rank || 0;
                    let rankClass = 'rank-1';
                    if (rank === 1) rankClass = 'rank-1';
                    else if (rank === 2) rankClass = 'rank-2';
                    else if (rank === 3) rankClass = 'rank-3';
                    else if (rank === 4) rankClass = 'rank-4';
                    else if (rank === 5) rankClass = 'rank-5';

                    let photoHtml = '';
                    if (topper['Photo URL'] && topper['Photo URL'] !== '') {
                        let photoUrl = topper['Photo URL'];
                        if (photoUrl.includes('thumbnail')) {
                            photoUrl = photoUrl.replace(/sz=w\d+/, 'sz=w1200');
                        }
                        if (photoUrl.includes('sz=w300')) {
                            photoUrl = photoUrl.replace('sz=w300', 'sz=w1200');
                        }
                        if (photoUrl.includes('sz=w200')) {
                            photoUrl = photoUrl.replace('sz=w200', 'sz=w1200');
                        }
                        if (photoUrl.includes('sz=w400')) {
                            photoUrl = photoUrl.replace('sz=w400', 'sz=w1200');
                        }
                        if (photoUrl.includes('sz=w600')) {
                            photoUrl = photoUrl.replace('sz=w600', 'sz=w1200');
                        }
                        if (photoUrl.includes('sz=w800')) {
                            photoUrl = photoUrl.replace('sz=w800', 'sz=w1200');
                        }
                        if (photoUrl.includes('sz=w1000')) {
                            photoUrl = photoUrl.replace('sz=w1000', 'sz=w1200');
                        }
                        if (!photoUrl.includes('sz=')) {
                            photoUrl = photoUrl + '&sz=w1200';
                        }
                        photoHtml = `<img src="${photoUrl}" alt="${topper['Name of student']}">`;
                    } else {
                        photoHtml = `<div class="no-photo">📷</div>`;
                    }

                    let percentage = topper.Percentage || 0;
                    if (typeof percentage === 'number') {
                        percentage = percentage.toFixed(2);
                    }

                    let subjectGradesHtml = '';
                    if (isGradeClass && gradeSubjects.length > 0) {
                        subjectGradesHtml = `<div class="subject-grades">`;
                        for (const gs of gradeSubjects) {
                            let gradeValue = topper[gs] || '—';
                            let gradeClass = '';

                            if (gradeValue !== '—') {
                                const gv = String(gradeValue).toUpperCase().trim();
                                if (['A+', 'A', 'A-'].includes(gv)) gradeClass = 'A';
                                else if (['B+', 'B', 'B-'].includes(gv)) gradeClass = 'B';
                                else if (['C+', 'C', 'C-'].includes(gv)) gradeClass = 'C';
                                else if (['D+', 'D', 'D-'].includes(gv)) gradeClass = 'D';
                                else if (['E+', 'E', 'E-'].includes(gv)) gradeClass = 'E';
                                else if (gv === 'F') gradeClass = 'F';
                                else gradeClass = gv.charAt(0) || '—';

                                if (gradeClass.length === 1 && /[A-F]/.test(gradeClass)) {
                                    gradeValue = gradeClass;
                                }
                            }

                            subjectGradesHtml += `
                                <span class="grade-letter ${gradeValue !== '—' ? gradeValue : ''}">${gradeValue}</span>
                            `;
                        }
                        subjectGradesHtml += `</div>`;
                    }

                    html += `
                        <div class="topper-card">
                            <div class="rank-badge ${rankClass}">
                                <span class="rank-badge-text">${rank}</span>
                            </div>
                            <div class="topper-photo">
                                ${photoHtml}
                            </div>
                            <div class="topper-name">${topper['Name of student'] || '—'}</div>
                            <div class="topper-roll">Roll No: ${topper['Roll No'] || '—'}</div>
                            <div class="topper-stats">
                                <div class="stat-item">
                                    <div class="stat-label">Percentage</div>
                                    <div class="stat-value">${percentage}%</div>
                                </div>
                            </div>
                            ${subjectGradesHtml}
                            <div class="topper-footer">
                                <div>Division: <span>${topper.Division || '—'}</span></div>
                                <div>Attendance: <span>${topper.Attendance || '—'}%</span></div>
                            </div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            app.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof google !== 'undefined' && google.script) {
                loadToppers();
            } else {
                document.getElementById('app').innerHTML = `
                    <div style="text-align:center;padding:40px;background:white;border-radius:10px;max-width:800px;margin:20px auto;">
                        <h2 style="color:#1e3c72;">🏆 Rank Holders Preview</h2>
                        <p style="color:#64748b;margin:15px 0;">This page is designed to run in Google Apps Script environment.</p>
                        <p style="color:#64748b;">Please deploy as a web app to load live data.</p>
                        <hr style="margin:20px 0;border-color:#e2e8f0;">
                        <button onclick="window.print()" style="padding:10px 25px;background:#1e3c72;color:white;border:none;border-radius:5px;cursor:pointer;font-size:16px;">🖨️ Test Print</button>
                    </div>
                `;
            }
        });

        console.log('🏆 Rank Holders Viewer loaded');
        console.log('📌 Use the print button or Ctrl+P to print');
    </script>

</body>
</html>
